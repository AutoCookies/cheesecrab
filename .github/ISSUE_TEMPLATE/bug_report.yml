name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in Cheeserag Studio.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Thank you for helping improve **Cheeserag Studio**.

        Please provide enough information to reproduce the issue.  
        **Do not include confidential documents, API keys, credentials, or private data.**

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clearly describe the bug and what you expected to happen.
      placeholder: |
        Describe the problem...

        Expected behavior:
        ...

        Actual behavior:
        ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the smallest possible set of steps that reproduces the issue.
      placeholder: |
        1. Start Cheeserag Studio with ...
        2. Create a workspace ...
        3. Upload ...
        4. Ask ...
        5. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Messages
      description: Paste relevant logs, stack traces, or error messages.
      render: shell
      placeholder: |
        Paste logs here...

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Cheeserag Studio is affected?
      options:
        - Studio / Next.js
        - Cheese API / FastAPI
        - RAG Pipeline
        - Document Ingestion
        - Retrieval
        - Citation Engine
        - Cheesebrain / LLM Inference
        - PomaiDB
        - Cheeserap Agent
        - Audio Overview
        - Docker / Deployment
        - CLI
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cheeserag Version / Commit
      description: Provide the release version, branch, or commit SHA.
      placeholder: "e.g. main @ abc1234"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Ubuntu / Debian
        - Other Linux
        - macOS
        - Windows / WSL2
        - Docker
        - Other
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: CPU Architecture
      placeholder: "e.g. x86_64, ARM64"

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Include CPU, RAM, GPU, and other relevant hardware.
      placeholder: "e.g. Intel i7 / 16 GB RAM / RTX 4060"

  - type: input
    id: model
    attributes:
      label: Local Model
      description: If the issue involves AI inference or RAG, provide the model name and quantization.
      placeholder: "e.g. Qwen2.5-0.5B-Instruct Q4_K_M"

  - type: textarea
    id: rag_config
    attributes:
      label: RAG Configuration
      description: If applicable, provide relevant retrieval or embedding configuration.
      placeholder: |
        Embedding model:
        top_k:
        min_score:
        chunk size:
        overlap:
        closed-book threshold:

  - type: textarea
    id: documents
    attributes:
      label: Document / Data Context
      description: Describe the type and approximate size of the affected documents. Do not upload confidential files.
      placeholder: |
        Document type: PDF
        Approximate size: 25 MB
        Pages: 120
        OCR: Yes
        Other relevant information: ...

  - type: textarea
    id: reproduction_data
    attributes:
      label: Minimal Reproduction
      description: Provide a sanitized example, query, command, or small dataset that demonstrates the issue.
      placeholder: |
        Query:
        ...

        Input:
        ...

        Expected:
        ...

        Actual:
        ...

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Recordings
      description: Add screenshots or recordings if they help explain the issue.
      placeholder: "Drag and drop screenshots here."

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy & Security
      options:
        - label: I have removed API keys, credentials, personal information, and confidential documents from this report.
          required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and could not find a duplicate.
          required: true
        - label: I have provided reproducible steps.
          required: true
        - label: I have included relevant logs or configuration where applicable.
          required: false